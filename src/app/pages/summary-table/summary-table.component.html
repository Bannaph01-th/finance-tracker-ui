<app-page-breadcrumb pageTitle="ตารางรายรับรายจ่าย" />

<div class="space-y-6">
  <!-- Table -->
  <div class="mt-4">
    <app-finance-table (openModal)="openModal()" />
  </div>

  <app-modal
    [isOpen]="isOpen"
    (close)="closeModal()"
    className="max-w-[700px] p-6 lg:p-10"
  >
    <div>
      <h5 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white">
        เพิ่มรายรับ / รายจ่าย
      </h5>

      <p class="text-sm text-gray-500 dark:text-gray-400">
        เพิ่มรายการเงินเข้า หรือเงินออกของคุณ
      </p>

      <div class="mt-6 grid gap-4">
        <input
          type="text"
          placeholder="ชื่อรายการ"
          class="h-11 rounded-lg border px-4"
        />

        <input
          type="number"
          placeholder="จำนวนเงิน"
          class="h-11 rounded-lg border px-4"
        />

        <select class="h-11 rounded-lg border px-4">
          <option>รายรับ</option>
          <option>รายจ่าย</option>
        </select>

        <select class="h-11 rounded-lg border px-4">
          <option>ขายหน้าร้าน</option>
          <option>ขายหน้าบ้าน</option>
        </select>

        <input
          type="text"
          placeholder="หมายเหตุ"
          class="h-11 rounded-lg border px-4"
        />
      </div>

      <button
        class="mt-6 w-full rounded-xl bg-brand-500 py-3 font-medium text-white"
      >
        บันทึก
      </button>
    </div>
  </app-modal>
</div>
