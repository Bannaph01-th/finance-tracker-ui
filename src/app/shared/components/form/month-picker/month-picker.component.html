<div>
  @if (label) {
    <app-label [for]="id">{{ label }}</app-label>
  }

  <div class="relative">
    <input
      #monthInput
      [id]="id"
      placeholder="เลือกเดือน"
      autocomplete="off"
      class="h-11 w-full rounded-lg border bg-transparent px-4 py-2.5 pr-11 text-sm"
    />

    <span
      class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 text-gray-500 dark:text-gray-400"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1em"
        height="1em"
        viewBox="0 0 24 24"
        fill="none"
        class="size-6"
      >
        <path
          fill="currentColor"
          d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1Zm12 8H5v9h14v-9Z"
        />
      </svg>
    </span>
  </div>
</div>
